# Local Postgres for the API (server/). Start with `docker compose up -d postgres`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sdd
      POSTGRES_PASSWORD: sdd
      POSTGRES_DB: sdd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the sdd_test database the Go tests reset freely.
      - ./server/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdd -d sdd"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
